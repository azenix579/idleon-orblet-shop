<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lil Orblet Shop Optimizer</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#121526;color:#eef3ff}
.wrap{max-width:920px;margin:0 auto;padding:16px}
h1{color:#3ecbff;margin:8px 0}
.muted{color:#8ea0c4;font-size:14px}
.card{background:#1b2140;border:1px solid #2d3a66;border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>div{flex:1;min-width:140px}
label{display:block;font-size:12px;color:#8ea0c4;margin-bottom:4px}
input,select{width:100%;box-sizing:border-box;background:#10182f;color:#fff;border:1px solid #2d3a66;border-radius:8px;padding:8px}
.banner{background:#15244a;border:1px solid #3ecbff;border-radius:12px;padding:16px;font-size:20px}
.banner b{color:#3ecf8e;font-size:26px}
.up{display:grid;grid-template-columns:1fr 220px 160px;gap:10px;align-items:center;border:1px solid #2d3a66;border-radius:10px;padding:12px;margin:10px 0;background:#151c36}
.up.next{outline:2px solid #3ecf8e}
.lvbox{background:#0b1020;border:2px solid #ffd369;border-radius:10px;padding:8px}
.lvbox input{font-size:28px;font-weight:800;text-align:center;color:#ffd369;height:48px}
.step{display:flex;gap:6px;margin-top:6px}
.step button{flex:1;height:36px;font-size:20px;font-weight:800;border:0;border-radius:8px;background:#3ecbff;color:#042;cursor:pointer}
.cost{font-size:22px;font-weight:800;color:#ffd369}
</style>
</head>
<body>
<div class="wrap">
<h1>Lil Orblet Shop</h1>
<p class="muted">Yellow box on each upgrade = your current level. Change it; next cost updates.</p>

<div class="card row">
<div><label>Orblets on hand</label><input id="have" type="number" value="0"></div>
<div><label>Orblets / hour</label><input id="rate" type="number" value="15"></div>
<div><label>Zenith Market</label><select id="zenith"><option>YES</option><option>NO</option></select></div>
<div><label>Militia unlocks maps</label><select id="militia"><option>YES</option><option>NO</option></select></div>
<div><label>Unlock order</label><select id="gate"><option>YES</option><option>NO</option></select></div>
</div>

<div class="banner">BUY NEXT: <b id="nextName">set levels</b> &nbsp; cost <b id="nextCost">—</b></div>

<div id="list"></div>

<div class="card">
<strong>Glorify attempt</strong> (not the shop level)
<div class="row" style="margin-top:8px">
<div><label>Attempt cost</label><input id="gCost" type="number" value="32"></div>
<div><label>Success chance</label><input id="gChance" type="number" step="0.01" value="0.10"></div>
<div><label>PTS per orblet</label><div id="gEv" class="cost">—</div></div>
</div>
</div>
</div>
<script>
const UP=[
 {name:"Emulsion",desc:"Zenith cluster statue EXP",pri:6.5,cap:15,decay:0.12,base:8,g:1.18},
 {name:"Hydration",desc:"All-outpost collection. Decays after LV 12",pri:7,cap:12,decay:0.45,base:6,g:1.16},
 {name:"Talented",desc:"RG talent points",pri:4.5,cap:10,decay:0.15,base:10,g:1.17},
 {name:"Full Clear",desc:"New-outpost kills. Junk after LV 1 if militia YES",pri:1.2,cap:1,decay:2.5,base:8,g:1.18},
 {name:"Glorification",desc:"Shop level that enables rolls",pri:3,cap:3,decay:0.4,base:16,g:1.14},
 {name:"Intervene",desc:"Regal Intervention chance",pri:4,cap:12,decay:0.15,base:14,g:1.17},
 {name:"Stronk Rank",desc:"Unit rank EXP",pri:5.5,cap:20,decay:0.1,base:16,g:1.16},
 {name:"Bargain",desc:"Cheaper Armory / masterclass. Keep buying",pri:12,cap:80,decay:0.02,base:20,g:1.15}
];
const list=document.getElementById("list");
UP.forEach((u,i)=>{
  const d=document.createElement("div");
  d.className="up";
  d.innerHTML=`<div><b>${i+1}. ${u.name}</b><div class="muted">${u.desc}</div><div class="muted">Score <span class="sc">—</span></div></div>
  <div class="lvbox"><label>YOUR CURRENT LEVEL</label>
  <input class="lv" type="number" min="0" value="1">
  <div class="step"><button type="button" data-d="-1">−</button><button type="button" data-d="1">+</button></div></div>
  <div><label>Next cost</label><div class="cost nxt">—</div>
  <label>Actual tooltip (optional)</label><input class="tip" type="number" placeholder="if different"></div>`;
  list.appendChild(d);
});
function cost(u,lv,tip){
  if(tip) return +tip;
  return Math.max(1,Math.round(u.base*Math.pow(u.g,Math.max(0,lv))));
}
function calc(){
  const have=+$("have").value||0, rate=+$("rate").value||0;
  const zenith=$("zenith").value==="YES", militia=$("militia").value==="YES", gate=$("gate").value==="YES";
  const cards=[...document.querySelectorAll(".up")];
  const lvs=cards.map(c=>Math.max(0,+(c.querySelector(".lv").value)||0));
  const costs=cards.map((c,i)=>cost(UP[i],lvs[i],c.querySelector(".tip").value));
  let best=-1,bestS=-1;
  cards.forEach((c,i)=>{
    const unlocked=!gate||i===0||lvs[i-1]>=1;
    let pri=UP[i].pri;
    if(UP[i].name==="Emulsion"&&!zenith)pri=0;
    if(UP[i].name==="Full Clear"&&militia&&lvs[i]>=1)pri*=0.05;
    pri=pri/(1+Math.max(0,lvs[i]-UP[i].cap)*UP[i].decay);
    let sc=0;
    if(unlocked&&costs[i]>0){sc=pri/costs[i]; if(lvs[i]===0&&i<7)sc+=18/costs[i];}
    if(unlocked&&sc>bestS){bestS=sc;best=i;}
    c.classList.toggle("next",i===best);
    c.querySelector(".nxt").textContent=costs[i].toLocaleString();
    c.querySelector(".sc").textContent=sc?sc.toFixed(4):"—";
  });
  $("nextName").textContent=best>=0?UP[best].name:"set levels";
  $("nextCost").textContent=best>=0?costs[best].toLocaleString():"—";
  const gc=+$("gCost").value||0, ch=+$("gChance").value||0;
  $("gEv").textContent=gc? (10*ch/gc).toFixed(3):"—";
}
function $(id){return document.getElementById(id)}
document.querySelectorAll(".step button").forEach(b=>{
  b.onclick=()=>{const inp=b.closest(".up").querySelector(".lv"); inp.value=Math.max(0,(+inp.value||0)+(+b.dataset.d)); calc();};
});
document.body.addEventListener("input",calc);
calc();
</script>
</body>
</html>
